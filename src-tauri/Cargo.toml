[package]
name = "rfid-bestandsabgleich"
version = "4.1.3"
description = "Bestandabgleich-Software der Firma implantcast GmbH für die Inventur bei Bestandskunden."
authors = ["implantcast GmbH"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
calamine = "0.32"
csv = "1.3"
rust_xlsxwriter = "0.89"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
typst-as-lib = "0.17"
typst-pdf = "0.15"
typst = "0.15"
typst-layout = "0.15"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = 3 # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Pinned: tauri-plugin-process 2.4+ requires tauri 2.12, while the app is on tauri 2.11.
tauri-plugin-process = "=2.3.1"
